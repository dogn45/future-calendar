name: Build iPhone widget trial
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned app
        run: xcodebuild -project FutureCalendar.xcodeproj -scheme FutureCalendar -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FutureCalendar.app Payload/
          zip -qr FutureCalendarWidgetTrial.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FutureCalendarWidgetTrial
          path: FutureCalendarWidgetTrial.ipa
